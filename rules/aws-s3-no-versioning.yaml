id: aws-s3-no-versioning
name: S3 Bucket Without Versioning
description: S3 bucket does not have versioning enabled, which prevents recovery from accidental deletions or overwrites.
severity: medium
type: terraform
compliance:
  - soc2
  - hipaa
conditions:
  - resource: aws_s3_bucket
    property: versioning.enabled
    operator: missing
  - resource: aws_s3_bucket
    property: versioning.enabled
    operator: equals
    value: false
remediation:
  description: Enable versioning on the S3 bucket to protect against accidental deletions.
  steps:
    - Add versioning configuration to the S3 bucket resource
    - Set versioning.enabled = true
    - Consider enabling lifecycle policies to manage old versions
  code_example: |
    resource "aws_s3_bucket" "example" {
      bucket = "my-bucket"
    }
    
    resource "aws_s3_bucket_versioning" "example" {
      bucket = aws_s3_bucket.example.id
      
      versioning_configuration {
        status = "Enabled"
      }
    }

